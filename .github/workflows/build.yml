name: Tests

on: [ push, pull_request ]

jobs:
    tests:
        name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony_version }} / ${{ matrix.os }} / ${{ matrix.dependency-version }}

        # The bundle constraints are widened to ^7.0|^8.0, but roach-php/core 3.2.1
        # still requires symfony/* ^7.0 and php ~8.2.0||~8.3.0||~8.4.0, so the
        # Symfony 8.x and PHP 8.5 cells cannot resolve until core widens its
        # constraints upstream. Keep them as allowed failures so the dual-support
        # intent stays visible without turning the build red.
        continue-on-error: ${{ matrix.php == '8.5' || matrix.symfony_version != '7.4.*' }}

        env:
            extensions: dom, curl
            key: cache-v1
            PHPUNIT_COVERAGE: 0
            PHP_INI: date.timezone='UTC', memory_limit=-1

        strategy:
            fail-fast: false
            matrix:
                os: [ 'ubuntu-latest' ]
                php: [ '8.2', '8.3', '8.4', '8.5' ]
                symfony_version: [ '7.4.*', '8.0.*', '8.1.*' ]
                dependency-version: [ 'prefer-lowest', 'prefer-stable' ]
                exclude:
                    # Symfony >= 8.0 requires PHP >= 8.4
                    -   php: '8.2'
                        symfony_version: '8.0.*'
                    -   php: '8.2'
                        symfony_version: '8.1.*'
                    -   php: '8.3'
                        symfony_version: '8.0.*'
                    -   php: '8.3'
                        symfony_version: '8.1.*'

        runs-on: ${{ matrix.os }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ${{ env.extensions }}
                    coverage: pcov
                    ini-values: ${{ env.PHP_INI }}
                    tools: composer:v2, flex

            -   name: Determine composer cache directory
                run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

            -   name: Cache dependencies installed with composer
                uses: actions/cache@v4
                with:
                    path: "${{ env.COMPOSER_CACHE_DIR }}"
                    key: "php-${{ matrix.php }}-composer-${{ matrix.dependency-version }}-${{ matrix.symfony_version }}-${{ matrix.os }}-${{ hashFiles('composer.lock') }}"
                    restore-keys: "php-${{ matrix.php }}-composer-${{ matrix.dependency-version }}-${{ matrix.symfony_version }}-${{ matrix.os }}-"

            -   name: Print PHP Version
                run: php -v

            -   name: Print Composer Version
                run: composer -V

            -   name: Print PHP Extensions
                run: php -m

            -   name: Validate composer.json and composer.lock
                run: composer validate --strict

            -   name: Install dependencies
                env:
                    SYMFONY_REQUIRE: ${{ matrix.symfony_version }}
                run: composer update --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi --${{ matrix.dependency-version }}

            -   name: Install PHPUnit
                run: vendor/bin/simple-phpunit install

            -   name: Run tests with phpunit
                run: vendor/bin/simple-phpunit -c phpunit.xml.dist
